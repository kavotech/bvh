<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Booking Request | Breezyee Vans</title><link rel="stylesheet" href="style.css"></head>
<body class="admin-review-page"><main class="admin-review-shell"><a class="admin-review-back" href="/dashboard">← Admin dashboard</a><div id="reviewStatus" class="admin-review-status">Loading booking request…</div><section id="reviewContent" hidden><div class="admin-review-header"><div><p class="eyebrow">Booking request</p><h1 id="reviewTitle">Review booking</h1><p id="reviewReference"></p></div><span id="reviewState" class="status-badge"></span></div><div class="admin-review-grid"><article class="admin-review-card"><h2>Booking details</h2><dl id="bookingDetails"></dl></article><article class="admin-review-card"><h2>Price breakdown</h2><dl id="priceDetails"></dl></article><article class="admin-review-card"><h2>Driver verification</h2><dl id="driverDetails"></dl><div id="driverDocuments" class="driver-documents"></div></article></div><div class="admin-review-actions"><button id="approveReview" class="btn btn-primary">Approve booking</button><button id="rejectReview" class="btn btn-outline">Decline booking</button></div><p class="admin-review-note">Approval and rejection require your administrator verification code. Prices and availability are rechecked securely on the server.</p></section></main><script type="module" src="/admin-booking-review.js"></script></body></html>
